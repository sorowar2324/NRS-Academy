<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tuition Manager</title>

<style>
:root{
  --ink:#1c2430;
  --paper:#f6f7f5;
  --card:#fff;
  --navy:#22304a;
  --teal:#2f9e8f;
  --teal-dark:#24796d;
  --amber:#d9a441;
  --red:#c0564a;
  --line:#e4e6e1;
  --muted:#6b7480;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
  "Noto Sans Bengali",sans-serif;
  background:var(--paper);
  color:var(--ink);
  padding-bottom:70px;
}

header.top{
  background:var(--navy);
  color:#fff;
  padding:16px 18px;
  font-weight:700;
  font-size:1.15rem;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.gear{
  background:none;
  border:none;
  color:#fff;
  font-size:1.2rem;
}

.content{
  padding:16px;
  max-width:720px;
  margin:auto;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

h1{
  font-size:1.3rem;
  margin:4px 0 16px;
}

h2{
  font-size:1rem;
  margin:22px 0 10px;
  color:var(--muted);
}

.view-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.view-header h1{
  margin:0;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
}

.stat-card .label{
  font-size:.76rem;
  color:var(--muted);
  margin-bottom:4px;
}

.stat-card .value{
  font-size:1.35rem;
  font-weight:700;
}

.accent-teal .value{color:var(--teal-dark)}
.accent-red .value{color:var(--red)}
.accent-amber .value{color:var(--amber)}

.card-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:8px;
}

.item-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
}

.row1{
  display:flex;
  justify-content:space-between;
  font-weight:600;
  font-size:.95rem;
  gap:10px;
}

.row2{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:.82rem;
  margin-top:4px;
  gap:10px;
}

.actions{
  display:flex;
  gap:14px;
  margin-top:9px;
  flex-wrap:wrap;
}

.btn-primary{
  background:var(--teal);
  color:#fff;
  border:none;
  padding:9px 16px;
  border-radius:8px;
  font-size:.88rem;
  cursor:pointer;
  font-weight:600;
}

.btn-secondary{
  background:#eef0ec;
  color:var(--ink);
  border:none;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}

.btn-danger{
  color:var(--red);
  background:none;
  border:none;
  cursor:pointer;
  font-size:.82rem;
  padding:0;
}

.btn-link{
  background:none;
  border:none;
  color:var(--teal-dark);
  cursor:pointer;
  font-size:.82rem;
  padding:0;
  font-weight:600;
}

.search-box,
input[type=date],
input[type=month],
input[type=text],
input[type=number],
input[type=password],
select,
textarea{
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:.92rem;
  font-family:inherit;
  width:100%;
  background:#fff;
}

.search-box{
  margin-bottom:12px;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.toolbar label{
  font-size:.85rem;
  color:var(--muted);
  flex:1;
  min-width:140px;
}

.att-row{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:8px;
}

.att-row .name{
  font-weight:600;
  margin-bottom:8px;
}

.att-btns{
  display:flex;
  gap:6px;
}

.att-btn{
  flex:1;
  padding:8px 4px;
  border-radius:7px;
  border:1px solid var(--line);
  background:#fff;
  cursor:pointer;
}

.att-btn.selected.present{
  background:var(--teal);
  color:#fff;
}

.att-btn.selected.absent{
  background:var(--red);
  color:#fff;
}

.att-btn.selected.late{
  background:var(--amber);
  color:#fff;
}

.due-positive{
  color:var(--red);
  font-weight:700;
}

.due-zero{
  color:var(--teal-dark);
  font-weight:600;
}

.empty-msg{
  color:var(--muted);
  text-align:center;
  padding:24px 0;
}

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(20,26,36,.45);
  z-index:50;
  align-items:flex-end;
  justify-content:center;
}

.modal-overlay.active{
  display:flex;
}

.modal{
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:20px;
  width:100%;
  max-width:520px;
  max-height:88vh;
  overflow-y:auto;
}

.modal h2{
  margin-top:0;
  color:var(--ink);
}

.form-row{
  margin-bottom:12px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.form-row label{
  font-size:.8rem;
  color:var(--muted);
  font-weight:600;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:16px;
}

nav.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--navy);
  display:flex;
  z-index:20;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  flex:1;
  background:none;
  border:none;
  color:#a9b4c4;
  padding:10px 2px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:.68rem;
  cursor:pointer;
}

.nav-btn .ic{
  font-size:1.15rem;
}

.nav-btn.active{
  color:#fff;
}

.nav-btn.active .ic{
  color:var(--teal);
}

.login-box{
  max-width:420px;
  margin:50px auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.login-box h1{
  text-align:center;
}

.login-logo{
  text-align:center;
  font-size:3rem;
  margin-bottom:8px;
}

.student-header{
  background:var(--navy);
  color:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:12px;
}

.student-header h2{
  color:#fff;
  margin:0 0 5px;
}

.student-info{
  font-size:.85rem;
  opacity:.85;
}

.portal-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
}

.portal-card h3{
  margin:0 0 10px;
  font-size:1rem;
}

.big-number{
  font-size:1.7rem;
  font-weight:700;
}

.logout{
  margin-top:15px;
  width:100%;
}

.share-btn{
  background:#eef0ec;
  border:none;
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer;
  font-size:.8rem;
}

.success{
  color:var(--teal-dark);
}

.danger-text{
  color:var(--red);
}

@media(min-width:560px){
  .cards{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header class="top" id="main-header">
  <span>📚 Tuition Manager</span>
  <button class="gear" onclick="openSettings()">⚙️</button>
</header>

<div class="content">

<!-- ================= ADMIN LOGIN ================= -->

<section id="admin-login" class="view">

<div class="login-box">

<div class="login-logo">📚</div>

<h1>Teacher / Admin Login</h1>

<div class="form-row">
<label>Admin Password</label>
<input type="password" id="admin-password" placeholder="Password">
</div>

<button class="btn-primary" style="width:100%" onclick="adminLogin()">
Login
</button>

<button class="btn-secondary" style="width:100%;margin-top:10px"
onclick="showStudentLogin()">
🎓 Student Login
</button>

</div>

</section>


<!-- ================= STUDENT LOGIN ================= -->

<section id="student-login" class="view">

<div class="login-box">

<div class="login-logo">🎓</div>

<h1>Student Login</h1>

<p style="color:var(--muted);font-size:.85rem;text-align:center">
আপনার Student ID দিয়ে Login করুন
</p>

<div class="form-row">
<label>Student ID</label>
<input type="text" id="student-login-id"
placeholder="যেমন: STU001">
</div>

<button class="btn-primary" style="width:100%"
onclick="studentLogin()">
Login
</button>

<button class="btn-secondary"
style="width:100%;margin-top:10px"
onclick="showAdminLogin()">
⬅️ Admin Login
</button>

</div>

</section>


<!-- ================= STUDENT PORTAL ================= -->

<section id="student-portal" class="view">

<div id="student-portal-content"></div>

<button class="btn-secondary logout"
onclick="studentLogout()">
🚪 Logout
</button>

</section>


<!-- ================= DASHBOARD ================= -->

<section id="view-dashboard" class="view active">

<h1>Dashboard</h1>

<div class="cards" id="dashboard-cards"></div>

<h2>সাম্প্রতিক পেমেন্ট</h2>

<div class="card-list" id="recent-payments-list"></div>

</section>


<!-- ================= STUDENTS ================= -->

<section id="view-students" class="view">

<div class="view-header">

<h1>Students</h1>

<button class="btn-primary"
onclick="openStudentModal()">
+ Add
</button>

</div>

<input
type="text"
id="student-search"
class="search-box"
placeholder="নাম / Student ID দিয়ে খুঁজুন..."
>

<div class="card-list" id="students-list"></div>

</section>


<!-- ================= ATTENDANCE ================= -->

<section id="view-attendance" class="view">

<h1>Attendance</h1>

<div class="toolbar">

<label>
তারিখ:
<input type="date" id="attendance-date">
</label>

</div>

<div id="attendance-list"></div>

<button class="btn-primary"
style="width:100%;margin-top:8px"
onclick="saveAttendance()">
Save Attendance
</button>

<button class="btn-secondary"
style="width:100%;margin-top:8px"
onclick="shareAttendance()">
📤 Share Attendance
</button>

</section>


<!-- ================= MARKS ================= -->

<section id="view-marks" class="view">

<div class="view-header">

<h1>Marks</h1>

<button class="btn-primary"
onclick="openMarksModal()">
+ Add
</button>

</div>

<div class="card-list" id="marks-list"></div>

</section>


<!-- ================= PAYMENTS ================= -->

<section id="view-payments" class="view">

<div class="view-header">

<h1>Payments</h1>

<button class="btn-primary"
onclick="openPaymentModal()">
+ Add
</button>

</div>

<h2>বকেয়া (Due) সামারি</h2>

<div class="card-list" id="dues-list"></div>

<h2>পেমেন্ট হিস্ট্রি</h2>

<div class="card-list" id="payments-list"></div>

</section>


<!-- ================= SETTINGS ================= -->

<section id="view-settings" class="view">

<h1>Settings & Backup</h1>

<p style="color:var(--muted);font-size:.88rem;line-height:1.5">
সব ডেটা এই ফোনের ব্রাউজারেই সেভ থাকে।
কোনো সার্ভারে যায় না।
</p>

<div class="backup-row">

<button class="btn-primary"
onclick="exportBackup()">
⬇️ Backup Download
</button>

<button class="btn-secondary"
onclick="document.getElementById('import-file').click()">
⬆️ Restore Backup
</button>

<input
type="file"
id="import-file"
accept=".json"
style="display:none"
onchange="importBackup(event)"
>

</div>

<div style="margin-top:20px">

<label style="font-size:.8rem;color:var(--muted)">
Admin Password
</label>

<input
type="password"
id="new-admin-password"
placeholder="নতুন Password"
style="margin-top:5px"
>

<button
class="btn-primary"
style="margin-top:8px"
onclick="changeAdminPassword()">
Change Password
</button>

</div>

<div style="margin-top:20px">

<button
class="btn-danger"
style="border:1px solid var(--red);
border-radius:8px;
padding:9px 14px"
onclick="wipeAllData()">
🗑️ সব ডেটা মুছে ফেলুন
</button>

</div>

</section>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav" id="bottom-nav">

<button class="nav-btn active"
data-view="dashboard"
onclick="switchView('dashboard')">
<span class="ic">🏠</span>
Dashboard
</button>

<button class="nav-btn"
data-view="students"
onclick="switchView('students')">
<span class="ic">🧑‍🎓</span>
Students
</button>

<button class="nav-btn"
data-view="attendance"
onclick="switchView('attendance')">
<span class="ic">✅</span>
Attendance
</button>

<button class="nav-btn"
data-view="marks"
onclick="switchView('marks')">
<span class="ic">📝</span>
Marks
</button>

<button class="nav-btn"
data-view="payments"
onclick="switchView('payments')">
<span class="ic">💰</span>
Payments
</button>

</nav>


<!-- ================= MODAL ================= -->

<div id="modal-overlay" class="modal-overlay">

<div class="modal" id="modal-box"></div>

</div>


<script>

/* =========================================================
DATABASE
========================================================= */

const DB_KEY = "tuition_manager_data_v2";

function emptyDB(){

return {

students:[],
attendance:[],
marks:[],
payments:[],

nextId:{
students:1,
attendance:1,
marks:1,
payments:1
},

adminPassword:"1234"

};

}

function loadDB(){

try{

const raw=localStorage.getItem(DB_KEY);

if(raw){

const data=JSON.parse(raw);

if(!data.adminPassword)
data.adminPassword="1234";

return data;

}

}catch(e){

console.log(e);

}

return emptyDB();

}

let DB=loadDB();

function saveDB(){

localStorage.setItem(DB_KEY,JSON.stringify(DB));

}

function todayStr(){

return new Date().toISOString().slice(0,10);

}

function nid(table){

return DB.nextId[table]++;

}


/* =========================================================
STUDENTS
========================================================= */

function generateStudentID(){

let id;

do{

id="STU"+String(DB.nextId.students).padStart(3,"0");

DB.nextId.students++;

}while(DB.students.some(s=>s.student_id===id));

return id;

}


function listStudents(status){

let rows=DB.students.slice();

if(status)
rows=rows.filter(s=>s.status===status);

return rows.sort((a,b)=>
a.name.localeCompare(b.name)
);

}


function createStudent(data){

const s={

id:nid("students"),

student_id:data.student_id || generateStudentID(),

name:data.name,

phone:data.phone || "",

guardian_name:data.guardian_name || "",

guardian_phone:data.guardian_phone || "",

class_name:data.class_name || "",

subjects:data.subjects || "",

monthly_fee:Number(data.monthly_fee)||0,

address:data.address || "",

admission_date:data.admission_date || todayStr(),

status:"active",

notes:data.notes || ""

};

DB.students.push(s);

saveDB();

return s;

}


function updateStudent(id,data){

const s=DB.students.find(x=>x.id===id);

if(!s)return;

Object.assign(s,data);

saveDB();

}


function deleteStudent(id){

if(!confirm("এই Student এবং তার Attendance, Marks, Payment সব ডেটা Delete হবে। নিশ্চিত?"))
return;

DB.students=DB.students.filter(s=>s.id!==id);

DB.attendance=DB.attendance.filter(a=>a.student_id!==id);

DB.marks=DB.marks.filter(m=>m.student_id!==id);

DB.payments=DB.payments.filter(p=>p.student_id!==id);

saveDB();

renderStudents();

}


/* =========================================================
ATTENDANCE
========================================================= */

function attendanceForDate(date){

return listStudents("active").map(s=>{

const rec=DB.attendance.find(a=>
a.student_id===s.id &&
a.date===date
);

return{

student_id:s.id,
student_name:s.name,
status:rec?rec.status:null

};

});

}


function upsertAttendanceBulk(date,records){

records.forEach(r=>{

const existing=DB.attendance.find(a=>
a.student_id===r.student_id &&
a.date===date
);

if(existing){

existing.status=r.status;

}else{

DB.attendance.push({

id:nid("attendance"),

student_id:r.student_id,

date:date,

status:r.status,

note:""

});

}

});

saveDB();

}


/* =========================================================
MARKS
========================================================= */

function listMarks(studentId){

let rows=DB.marks.slice();

if(studentId)
rows=rows.filter(m=>m.student_id===studentId);

rows.sort((a,b)=>
b.exam_date.localeCompare(a.exam_date)
);

return rows.map(m=>({

...m,

student_name:
(DB.students.find(s=>s.id===m.student_id)||{}).name||"?"

}));

}


function createMarks(data){

const m={

id:nid("marks"),

student_id:Number(data.student_id),

exam_name:data.exam_name,

subject:data.subject,

marks_obtained:Number(data.marks_obtained),

total_marks:Number(data.total_marks)||100,

exam_date:data.exam_date||todayStr(),

note:data.note||""

};

DB.marks.push(m);

saveDB();

return m;

}


function deleteMarks(id){

if(!confirm("এই Marks Delete করবেন?"))
return;

DB.marks=DB.marks.filter(m=>m.id!==id);

saveDB();

renderMarks();

}


/* =========================================================
PAYMENTS
========================================================= */

function listPayments(studentId){

let rows=DB.payments.slice();

if(studentId)
rows=rows.filter(p=>p.student_id===studentId);

rows.sort((a,b)=>
b.payment_date.localeCompare(a.payment_date)
);

return rows.map(p=>({

...p,

student_name:
(DB.students.find(s=>s.id===p.student_id)||{}).name||"?"

}));

}


function createPayment(data){

const p={

id:nid("payments"),

student_id:Number(data.student_id),

amount:Number(data.amount),

for_month:data.for_month,

payment_date:data.payment_date||todayStr(),

method:data.method||"cash",

note:data.note||""

};

DB.payments.push(p);

saveDB();

return p;

}


function deletePayment(id){

if(!confirm("এই Payment Delete করবেন?"))
return;

DB.payments=DB.payments.filter(p=>p.id!==id);

saveDB();

renderPayments();

}


/* =========================================================
DUE
========================================================= */

function duesSummary(){

const now=new Date();

return listStudents("active").map(s=>{

const paid=DB.payments

.filter(p=>p.student_id===s.id)

.reduce((sum,p)=>
sum+Number(p.amount),0);

const admission=new Date(s.admission_date);

let monthsElapsed=

(now.getFullYear()-admission.getFullYear())*12+

(now.getMonth()-admission.getMonth())+1;

if(monthsElapsed<1)
monthsElapsed=1;

const expected=
monthsElapsed*Number(s.monthly_fee||0);

return{

student_id:s.id,

student_name:s.name,

student_code:s.student_id,

monthly_fee:s.monthly_fee,

months_expected:monthsElapsed,

total_expected:expected,

total_paid:paid,

due:Math.max(0,expected-paid)

};

});

}


/* =========================================================
DASHBOARD
========================================================= */

function dashboardData(){

const totalStudents=
listStudents("active").length;

const today=todayStr();

const todayAtt=
DB.attendance.filter(a=>a.date===today);

const todayPresent=
todayAtt.filter(a=>a.status==="present").length;

const todayAbsent=
todayAtt.filter(a=>a.status==="absent").length;

const thisMonth=today.slice(0,7);

const monthPayments=
DB.payments

.filter(p=>p.payment_date.startsWith(thisMonth))

.reduce((s,p)=>s+Number(p.amount),0);

return{

totalStudents,

todayPresent,

todayAbsent,

monthPayments,

recentPayments:listPayments().slice(0,5)

};

}


/* =========================================================
UI
========================================================= */

let currentView="dashboard";

function switchView(view){

currentView=view;

document.querySelectorAll(".view")
.forEach(v=>v.classList.remove("active"));

const target=document.getElementById("view-"+view);

if(target)
target.classList.add("active");

document.querySelectorAll(".nav-btn")
.forEach(b=>
b.classList.toggle(
"active",
b.dataset.view===view
)
);

if(view==="dashboard")
renderDashboard();

if(view==="students")
renderStudents();

if(view==="attendance")
renderAttendanceView();

if(view==="marks")
renderMarks();

if(view==="payments")
renderPayments();

}


function openSettings(){

switchView("settings");

document.querySelectorAll(".nav-btn")

status:selected.dataset.status

});

}

});

alert("Attendance select করুন।");

return;

}

upsertAttendanceBulk(date,records);

alert("Attendance saved successfully!");

renderAttendanceView();

/* =========================================================
BACKUP
========================================================= */

function exportBackup(){

const blob=new Blob(
[JSON.stringify(DB,null,2)],
{type:"application/json"}
);

const url=
URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=
`tuition-backup-${todayStr()}.json`;

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

URL.revokeObjectURL(url);

}


function importBackup(evt){

const file=evt.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=()=>{

try{

const parsed=
JSON.parse(reader.result);

if(!parsed.students ||
!parsed.nextId){

throw new Error("invalid");

}

if(!confirm(
"বর্তমান সব ডেটা replace হবে। নিশ্চিত?"
))
return;

DB=parsed;

if(!DB.adminPassword)
DB.adminPassword="1234";

saveDB();

alert("Backup Restore হয়েছে!");

switchView("dashboard");

}catch(e){

alert("Backup file সঠিক নয়।");

}

};

reader.readAsText(file);

evt.target.value="";

}

/* =========================================================
HELPER
========================================================= */

function escapeHTML(str){

return String(str??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeAttr(str){

return escapeHTML(str);

}
